buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'com.hollownight'
archivesBaseName = 'hollownight'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.18'
}

// Layout "plano": todos os arquivos na raiz do repositório (facilita subir pelo celular)
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = []
        }
    }
}

processResources {
    from('mods.toml') { into 'META-INF' }
    from('pack.mcmeta')
    from('watcher.png') { into 'assets/hollownight/textures/entity' }
    from('pt_br.json') { into 'assets/hollownight/lang' }
    from('en_us.json') { into 'assets/hollownight/lang' }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18-38.0.17'
}

jar.finalizedBy('reobfJar')
